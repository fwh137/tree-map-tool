<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>樹狀圖整理工具_v1.1.40</title>
<style>
:root{
  --bg:#f5f7fb; --panel:#fff; --line:#dce2ea; --text:#202733;
  --muted:#6b7280; --accent:#4f46e5; --accent2:#eef2ff;
  --danger:#dc2626; --shadow:0 8px 28px rgba(30,41,59,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;height:100vh;overflow:hidden}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px;overflow:hidden}
.logo{font-size:20px;font-weight:800;white-space:nowrap}
.badge{font-size:12px;color:var(--accent);background:var(--accent2);padding:5px 8px;border-radius:999px}
.toolbar{margin-left:0;display:flex;align-items:center;gap:7px;flex-wrap:nowrap;min-width:0;overflow-x:auto;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}
button{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13px}.apply-subbranch-active{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important;box-shadow:0 0 0 2px rgba(37,99,235,.22)!important}
.history-icon-btn{min-width:38px;width:38px;padding:8px 0;font-size:18px;line-height:1}.history-icon-btn:hover{background:#f8fafc}button:hover{background:#f8fafc}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;background:#fff}
textarea{resize:vertical;min-height:120px}
.layout{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(360px,1fr) 390px;min-height:0}
.left{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.searchbar{padding:14px;border-bottom:1px solid var(--line);background:#fff;display:flex;gap:8px}
.tree-wrap{overflow:auto;padding:18px 20px 80px}
.tree{min-width:max-content}
.node-row{display:flex;align-items:center;min-height:42px;position:relative}
.node-row.selected>.node-card{outline:2px solid #a5b4fc;background:#f5f7ff}
.toggle{width:28px;height:28px;padding:0;border:0;background:transparent;font-size:15px;color:var(--muted)}
.toggle.empty{visibility:hidden}
.node-card{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:7px 10px;cursor:pointer;min-width:230px}
.node-card:hover{background:#fff;border-color:var(--line);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.node-name{font-weight:650}
.node-type{font-size:11px;color:var(--muted);background:#f1f5f9;border-radius:999px;padding:3px 7px}
.children{margin-left:17px;border-left:1px solid #cbd5e1;padding-left:16px}
.children>.branch{position:relative}
.children>.branch:before{content:"";position:absolute;left:-17px;top:21px;width:16px;border-top:1px solid #cbd5e1}
.empty-state{padding:50px;text-align:center;color:var(--muted)}
.right{background:var(--panel);overflow:auto;padding:22px 22px 110px}
.panel-title{font-size:18px;font-weight:800;margin-bottom:18px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;position:sticky;bottom:0;z-index:20;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.actions>.format-actions{margin-top:0}
button.danger{background:#dc2626!important;border-color:#dc2626!important;color:#fff!important}
button.danger:hover{background:#b91c1c!important;border-color:#b91c1c!important;color:#fff!important}
.format-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;grid-column:1/-1}
.format-actions button{min-width:0;width:100%;}
@media(max-width:520px){.format-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.format-actions button{font-size:12px;padding:8px 4px}}
.full{grid-column:1/-1}
.stat{margin-top:20px;padding:12px;background:#f8fafc;border-radius:10px;font-size:12px;color:#64748b}
mark{background:#fef08a;border-radius:2px}
@media(max-width:850px){body{overflow:auto}.layout{height:auto;grid-template-columns:1fr}.left{height:65vh;border-right:0;border-bottom:1px solid var(--line)}.right{min-height:35vh}}

.flow-overview{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;overflow:auto}
.flow-title{font-size:12px;font-weight:800;color:#64748b;margin-bottom:9px}
.flow{display:flex;align-items:center;gap:7px;min-width:max-content}
.flow-box{padding:7px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;font-size:12px;font-weight:700;white-space:nowrap}
.flow-box.choice{background:#eef2ff;border-color:#a5b4fc;color:#3730a3}
.flow-arrow{color:#94a3b8;font-weight:800}
.flow-branches{display:flex;gap:7px;align-items:center}
.flow-branch{display:flex;align-items:center;gap:6px}

/* v0.2 流程圖視覺 */
.flow-overview{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;overflow:auto}
.flow-title{font-size:12px;font-weight:800;color:#64748b;margin-bottom:8px}
.flow{display:flex;align-items:center;gap:6px;min-width:max-content}
.flow-box{padding:6px 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.flow-box.choice{background:#eef2ff;border-color:#a5b4fc;color:#3730a3}
.flow-arrow{color:#94a3b8;font-weight:800}
.tree-wrap{overflow:auto;padding:30px 34px 90px;background:#fff}
.flow-canvas{position:relative;min-width:980px;min-height:600px;padding:10px}
.flow-node{position:absolute;z-index:2;min-width:82px;text-align:center;padding:7px 12px;background:#fff;border:0;border-radius:2px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:none}
.flow-node:hover{background:#f8fafc}
.flow-node.selected{outline:2px solid #818cf8;outline-offset:2px}
.flow-node.branch{border-radius:0}
.flow-node .sub{display:block;margin-top:3px;font-size:10px;font-weight:500;color:#6b7280}
.flow-svg{position:absolute;inset:0;z-index:1;pointer-events:none}
.flow-svg path,.flow-svg line{stroke:#111;stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke}
.flow-svg .arrow{fill:#111;stroke:none}
.flow-help{margin-top:12px;color:#64748b;font-size:12px}

/* v0.1.7：沿用 v0.1.3，僅修正文字完整顯示 */
.flow-canvas{overflow:visible}
.flow-node{
  min-width:96px;
  max-width:220px;
  white-space:normal;
  line-height:1.45;
  overflow:visible;
  text-overflow:clip;
  word-break:break-word;
}
.flow-node .sub{
  white-space:normal;
  overflow:visible;
}
.flow-help{white-space:normal}


/* v0.1.8：連續引線修正 */
.flow-svg{overflow:visible}
.flow-svg line{stroke:#111;stroke-width:1.2;fill:none;vector-effect:non-scaling-stroke}
.flow-node{background:transparent;box-shadow:none}
.flow-node .node-text,.flow-node .sub{
  background:#fff;
  padding:0 3px;
  white-space:nowrap;
}
.flow-node.selected{outline:2px solid #818cf8;outline-offset:3px;background:#fff}


/* v0.1.9：完整顯示所有分支 */
.flow-canvas{position:relative;overflow:auto;background:#fff}
.flow-svg{position:absolute;left:0;top:0;z-index:1;pointer-events:none}
.flow-node{
 position:absolute;z-index:2;min-width:86px;max-width:150px;
 padding:4px 7px;background:#fff;border:0;box-shadow:none;
 text-align:left;white-space:normal;line-height:1.35;
}
.flow-node .node-text{display:inline;font-size:14px;font-weight:700}
.flow-node .sub{display:inline;font-size:10px;color:#94a3b8;margin-left:6px;white-space:nowrap}
.flow-node.selected{outline:2px solid #818cf8;outline-offset:3px;border-radius:5px}


/* v0.2.0：自由定位節點＋滑鼠拉線 */
/* v1.1.34：左側獨立功能欄；按鈕不受畫布縮放影響 */
.editor-layout{grid-template-columns:52px minmax(0,1fr) 360px}
.function-rail{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;z-index:5}
.function-rail .rail-title{font-size:12px;font-weight:700;writing-mode:vertical-rl;text-orientation:mixed;text-align:center;align-self:center;color:var(--text);padding:5px 0 8px;letter-spacing:1px}
.function-rail button{width:40px;min-height:38px;padding:5px 2px;white-space:normal;line-height:1.2;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center}
@media(max-width:900px){.editor-layout{grid-template-columns:48px minmax(0,1fr) 38px}.function-rail{padding:7px 4px;gap:6px}.function-rail button{width:40px;font-size:11px}.editor-layout:not(.right-collapsed) .right{grid-column:1 / -1}}
.editor-layout{height:calc(100vh - 60px);display:grid;grid-template-columns:minmax(700px,1fr) 360px}
.canvas-panel{min-width:0;min-height:0;background:#fff;display:grid;grid-template-rows:auto minmax(0,1fr) 36px;position:relative}
.canvas-toolbar{min-width:0;min-height:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #e5e7eb;background:#fff}
.canvas-toolbar .tip{font-size:11px;color:#64748b;margin-left:auto}
.canvas-scroll{position:relative;min-width:0;min-height:0;overflow:hidden;background:#fafafa;touch-action:none;scrollbar-width:none;-ms-overflow-style:none}.canvas-scroll::-webkit-scrollbar{display:none;width:0;height:0}
.diagram{position:relative;width:1800px;height:1100px;background-image:radial-gradient(circle,rgba(100,116,139,.28) 1px,transparent 1.2px);background-size:10px 10px;background-position:0 0}
.diagram-svg{position:absolute;left:0;top:0;width:1800px;height:1100px;z-index:1;overflow:visible}
.conn{stroke:#111;stroke-width:1.6;fill:none;pointer-events:stroke}
.conn.previewing{stroke-dasharray:10 8;animation:connFlow .8s linear infinite}
@keyframes connFlow{to{stroke-dashoffset:-36}}
@media (prefers-reduced-motion:reduce){.conn.previewing{animation-duration:2.4s}}
.conn.selected{stroke:#4f46e5;stroke-width:3}
.conn-arrow{fill:#111;stroke:none}
.temp-line{stroke:#4f46e5;stroke-width:2;stroke-dasharray:7 5;fill:none;pointer-events:none}
.flow-node{position:absolute;z-index:3;min-width:110px;max-width:210px;padding:7px 12px;background:#fff;border:1px solid #b8c0cc;border-radius:6px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.flow-node:active{cursor:grabbing}
.flow-node.selected{border:2px solid #6366f1;padding:11px 16px}
.flow-node.grouped::after{content:"群";position:absolute;right:-7px;top:-7px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:#64748b;color:#fff;font:700 9px/16px Arial,sans-serif;text-align:center;pointer-events:none}
/* v1.1.21：判斷菱形與純文字說明圖塊 */
.flow-node.decision-node{
  min-width:118px;min-height:78px;max-width:210px;
  padding:0;background:transparent;border:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:0;
}
.flow-node.decision-node::before{
  content:"";position:absolute;inset:7px 14px;
  background:#fff;border:2px solid #64748b;

  z-index:0;
}
.flow-node.decision-node .node-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:110px;text-align:center}
.flow-node.decision-node .dn-name{font-size:13px;line-height:1.25}

body.dark .flow-node.text-node .dn-type{color:#fbbf24}

.flow-node .dn-name{display:block;font-size:14px;font-weight:750;line-height:1.4;word-break:break-word}
.flow-node .dn-type{display:block;font-size:10px;color:#64748b;margin-top:2px}
/* 四邊都有「隱形」連線熱區；平常不顯示圓點，只有開始拉線時才顯示 */
.handle{
  position:absolute;width:22px;height:22px;
  border:0;background:transparent;border-radius:50%;
  z-index:5;cursor:crosshair;
}
.handle::after{
  content:"";position:absolute;width:10px;height:10px;
  left:6px;top:6px;border:2px solid #4f46e5;
  background:#fff;border-radius:50%;
  opacity:0;transform:scale(.65);transition:opacity .08s,transform .08s;
}
.handle.active::after{
  opacity:1;transform:scale(1);
}
.handle-right{right:-11px;top:50%;margin-top:-11px}
.handle-left{left:-11px;top:50%;margin-top:-11px}
.handle-top{top:-11px;left:50%;margin-left:-11px}
.handle-bottom{bottom:-11px;left:50%;margin-left:-11px}
.flow-node.connection-ready .handle::after{opacity:1;transform:scale(1)}
.flow-node.connection-target .handle::after{opacity:1;transform:scale(1)}
.canvas-status{font-size:11px;color:#64748b;padding:6px 12px;border-top:1px solid #e5e7eb;background:#fff;flex-shrink:0;min-height:28px;box-sizing:border-box}
@media(max-width:900px){.editor-layout{grid-template-columns:1fr}.right{display:none}}


/* v0.2.2：直線引線＋10單位座標點／軸線 */
.coord-layer{
  position:absolute;left:0;top:0;width:100%;height:100%;

}
.coord-layer.on{display:block;pointer-events:none!important}

.coord-axis-x,.coord-axis-y{pointer-events:none!important;

.diagram{z-index:0}
.diagram-svg{z-index:1}

.flow-node .handle.active::after,.flow-node.connection-ready .handle::after,.flow-node.connection-target .handle::after{opacity:1;transform:scale(1)}
.flow-node .handle-right{right:-11px;top:50%;margin-top:-11px}

.flow-node .handle-top{top:-11px;left:50%;margin-left:-11px}

<script>
const SINGLE_CONNECTION_TOUCH_HIT_RADIUS = 22;

const safeStorage={
 getItem(k){try{return window.localStorage.getItem(k)}catch(e){return null}},
 setItem(k,v){try{window.localStorage.setItem(k,v)}catch(e){}},
 removeItem(k){try{window.localStorage.removeItem(k)}catch(e){}}
};
const KEY="dungeon_tree_v044_editor";
const seed={
 id:"root",name:"標題流程",type:"流程起點",note:"",content:"",children:[]
};



const DEFAULT_POS={
 root:{x:160,y:160}
};

const GRID_SIZE=10;
// v0.5.41：全域定位原點為 0，定位端點固定為 0、10、20、30…。
// 不再使用舊版的 5 單位半格偏移。
const GRID_ORIGIN=0;
function snapGrid(v){
 const n=Number(v);
 if(!Number.isFinite(n))return GRID_ORIGIN;
 return GRID_ORIGIN+Math.round((n-GRID_ORIGIN)/GRID_SIZE)*GRID_SIZE;
}
function snap10(v){return snapGrid(v)}

const hasStoredProject=!!safeStorage.getItem(KEY+"_data");
let data=loadData();
if(!hasStoredProject){
 safeStorage.setItem(KEY+"_data",JSON.stringify(data));
 safeStorage.setItem(KEY+"_filename","樹狀圖整理工具_v1.0.9.json");
}
let selectedId=data.id;
let selectedIds=[data.id]; // 選取順序；第一個是 Shift 範圍選取的起點。
let selectedConn=null;
let selectedConnIds=new Set();
let allCanvasSelected=false; // Ctrl+A 全選狀態；拖曳時保留全部流程圖與引線選取。
let groups=[];
let collapsedIds=loadCollapsedIds();
collapsedIds.delete(data.id);
let applyFlowchartMode=false;
let previewConnections=false;
let connectionSelectMode=false;
let applyFlowchartSourceId=null;
let applyFormatMode=false;
let applyFormatSourceId=null;
const undoStack=[],redoStack=[];
let restoringHistory=false;
const HISTORY_LIMIT=100;
let toolbarCollapsed=false;
let rightPanelCollapsed=false;
let functionRailCollapsed=false;
let fallbackFullscreen=false;

function updateLayoutControls(){
 const layout=document.querySelector(".editor-layout");
 const toolbar=document.querySelector(".canvas-toolbar");
 const toolbarBtn=document.getElementById("toolbarToggleBtn");
 const rightBtn=document.getElementById("rightPanelToggleBtn");
 if(toolbar){
  toolbar.classList.toggle("toolbar-collapsed",toolbarCollapsed);
  if(toolbarBtn){
   toolbarBtn.textContent=toolbarCollapsed?"工具列展開":"工具列收合";
   toolbarBtn.setAttribute("aria-expanded",String(!toolbarCollapsed));
  }
 }
 if(layout){
  layout.classList.toggle("right-collapsed",rightPanelCollapsed);
  layout.classList.toggle("rail-collapsed",functionRailCollapsed);
 }
 const rail=document.querySelector(".function-rail");
 const railBtn=document.getElementById("functionRailToggleBtn");
 if(rail)rail.classList.toggle("rail-collapsed",functionRailCollapsed);
 if(railBtn){
  railBtn.textContent=functionRailCollapsed?"▶":"◀";
  railBtn.setAttribute("aria-expanded",String(!functionRailCollapsed));
  railBtn.setAttribute("aria-label",functionRailCollapsed?"展開功能欄":"收合功能欄");
  railBtn.title=functionRailCollapsed?"展開功能欄":"收合功能欄";
 }
 if(rightBtn){
  const actionLabel=rightPanelCollapsed?"展開":"收合";
  rightBtn.innerHTML=[...actionLabel].map(ch=>`<span>${ch}</span>`).join("");
  rightBtn.setAttribute("aria-label",rightPanelCollapsed?"展開流程圖設定":"收合流程圖設定");
  rightBtn.title=rightPanelCollapsed?"展開流程圖設定":"收合流程圖設定";
  rightBtn.setAttribute("aria-expanded",String(!rightPanelCollapsed));
 }
}

function updateFullscreenButton(){
 const btn=document.getElementById("fullscreenBtn");
 if(!btn)return;
 const native=!!document.fullscreenElement;
 const active=native||fallbackFullscreen;
 btn.textContent=active?"⛶ 退出":"⛶ 全螢幕";
 btn.title=active?"退出全螢幕":"全螢幕";
 btn.setAttribute("aria-label",active?"退出全螢幕":"全螢幕");
}

async function toggleFullscreen(){
 if(document.fullscreenElement){
  try{await document.exitFullscreen()}catch(e){}
  return;
 }
 if(fallbackFullscreen){
  fallbackFullscreen=false;
  document.body.classList.remove("app-fullscreen-fallback");
  updateFullscreenButton();
  return;
 }
 try{
  if(document.documentElement.requestFullscreen){
   await document.documentElement.requestFullscreen({navigationUI:"hide"});
   return;
  }
 }catch(e){
  console.warn("Fullscreen API unavailable",e);
 }
 fallbackFullscreen=true;
 document.body.classList.add("app-fullscreen-fallback");
 updateFullscreenButton();
}

function handleFullscreenKeydown(e){
 if(e.key==="Escape"&&fallbackFullscreen){
  fallbackFullscreen=false;
  document.body.classList.remove("app-fullscreen-fallback");
  updateFullscreenButton();
 }
}
document.addEventListener("keydown",handleFullscreenKeydown);
document.addEventListener("fullscreenchange",updateFullscreenButton);

function historySnapshot(){
 return JSON.stringify({
  data:data,
  positions:positions,
  connections:connections,
  groups:groups,
  collapsedIds:[...collapsedIds],
  currentFileName:currentFileName,
  title:document.getElementById("appTitle")?.textContent||""
 });
}
function restoreSnapshot(raw){
 const s=JSON.parse(raw);
 data=s.data;
 positions=s.positions||{};
 connections=normalizeConnections(s.connections||[]);
 groups=normalizeGroups(s.groups||[],new Set(allNodes(data).map(n=>n.id)));
 collapsedIds=new Set(Array.isArray(s.collapsedIds)?s.collapsedIds.filter(id=>nodeById(id)):[]);
 selectedIds=selectedIds.filter(id=>nodeById(id));
 if(!selectedIds.length)selectedIds=[data.id];
 selectedId=selectedIds[0]||data.id;
 selectedConnIds=new Set();
 allCanvasSelected=false;
 currentFileName=s.currentFileName||currentFileName;
 const title=document.getElementById("appTitle");
 if(title)title.textContent=s.title||currentFileName;
 saveData();savePositions();saveConnections();saveGroups();saveCollapsedIds();
 render();
}
function pushHistory(){
 if(restoringHistory)return;
 undoStack.push(historySnapshot());
 if(undoStack.length>HISTORY_LIMIT)undoStack.shift();
 redoStack.length=0;
}
function undo(){
 if(!undoStack.length){setStatus("沒有可以返回的操作。");return}
 restoringHistory=true;
 redoStack.push(historySnapshot());
 restoreSnapshot(undoStack.pop());
 restoringHistory=false;
 setStatus("已返回上一個操作。");
}
function redo(){
 if(!redoStack.length){setStatus("沒有可以恢復的操作。");return}
 restoringHistory=true;
 undoStack.push(historySnapshot());
 restoreSnapshot(redoStack.pop());
 restoringHistory=false;
 setStatus("已恢復下一個操作。");
}
function handleHistoryKeydown(e){
 if(previewConnections)return;
 if((e.ctrlKey||e.metaKey)&&!e.altKey){
  const k=e.key.toLowerCase();
  if(k==="z"){e.preventDefault();undo();return}
  if(k==="y"){e.preventDefault();redo();return}
 }
}
document.addEventListener("keydown",handleHistoryKeydown);

function handleCanvasSelectionKeydown(e){
 if(previewConnections)return;
 if(!(e.ctrlKey||e.metaKey)||e.altKey||e.key.toLowerCase()!=="a")return;
 const canvas=document.getElementById("canvasScroll");
 const active=document.activeElement;
 const inCanvas=active===canvas||!!active?.closest?.("#canvasScroll");
 if(!inCanvas)return;
 e.preventDefault();
 e.stopPropagation();
 const ids=allNodes().map(n=>n.id);
 selectedIds=ids.slice();
 selectedId=ids.includes(selectedId)?selectedId:(ids[0]||data.id);
 selectedConnIds=new Set(connections.map(c=>c.id));
 selectedConn=null;
 allCanvasSelected=true;
 render();
 setStatus("已全選 "+selectedIds.length+" 個流程圖與 "+selectedConnIds.size+" 條引線；拖曳任一流程圖會全部一起移動。可在右側調整目前選取基準的座標。" );
}
document.addEventListener("keydown",handleCanvasSelectionKeydown);
function handleDeleteKeydown(e){
 if(previewConnections)return;
 if(e.key!=="Delete"||e.ctrlKey||e.metaKey||e.altKey)return;
 const active=document.activeElement;
 const tag=active?.tagName?.toLowerCase();
 if(tag==="input"||tag==="textarea"||tag==="select"||active?.isContentEditable)return;
 const canvas=document.getElementById("canvasScroll");
 const inCanvas=active===canvas||!!active?.closest?.("#canvasScroll");
 // Delete is global for canvas selections; if focus is elsewhere, only act when a real selection exists.
 const hasSelection=selectedIds.some(id=>id!==data.id)||selectedConnIds.size>0||!!selectedConn;
 if(!inCanvas&&!hasSelection)return;
 if(!hasSelection){setStatus("請選流程圖或引線");return}
 e.preventDefault();e.stopPropagation();
 deleteSelectedItems();
}
document.addEventListener("keydown",handleDeleteKeydown);


let dragging=null; // 拖曳流程圖：多選成員保持整批移動；不修改連線端點，只同步更新相關 bends。
let resizeMode=false;
let nodeResizeDrag=null;
let unsavedNodeDraft=null;
let nodeDraftDirty=false;
let positions=loadPositions();
let connections=loadConnections();
// 開啟專案時保留 JSON 內已保存的 children 階層。
// 只有實際新增／改接／刪除引線時才同步階層，避免單純點擊或重新 render
// 因舊引線資料重建樹狀結構，導致上游父分支突然消失。
collapsedIds=new Set([...collapsedIds].filter(id=>{const n=nodeById(id);return id!==data.id&&!!n&&(n.children||[]).length}));
saveCollapsedIds();
// 舊版可能保存 5、15、25… 座標；載入時已統一吸附到新的 0、10、20… 網格。
savePositions();
const savedGroups=safeStorage.getItem(KEY+"_groups");
try{groups=normalizeGroups(JSON.parse(savedGroups||"[]"),new Set(allNodes(data).map(n=>n.id)))}catch(e){groups=[]}
const savedAxis=safeStorage.getItem(KEY+"_axis");
let axisVisible=savedAxis===null ? true : savedAxis==="1";
let zoom=Number(safeStorage.getItem(KEY+"_zoom")||"1");
if(!Number.isFinite(zoom)||zoom<0.4||zoom>2.5)zoom=1;
let panX=0,panY=0;
let currentFileHandle=null;
let connectionDragActive=false;
let currentFileName=(safeStorage.getItem(KEY+"_filename")||"樹狀圖整理工具_v1.0.9.json");

function loadData(){try{const x=JSON.parse(safeStorage.getItem(KEY+"_data"));if(x&&x.children)return x}catch(e){}return JSON.parse(JSON.stringify(seed))}
function saveData(){safeStorage.setItem(KEY+"_data",JSON.stringify(data))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function findNode(id,n=data,p=null){if(n.id===id)return{node:n,parent:p};for(const c of n.children||[]){const r=findNode(id,c,n);if(r)return r}return null}
function nodeById(id){const r=findNode(id);return r?r.node:null}
function allNodes(n=data,a=[]){a.push(n);(n.children||[]).forEach(c=>allNodes(c,a));return a}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}


function loadCollapsedIds(){
 try{
  const raw=JSON.parse(safeStorage.getItem(KEY+"_collapsed")||"[]");
  return new Set(Array.isArray(raw)?raw.filter(id=>typeof id==="string"):[]);
 }catch(e){return new Set()}
}
function saveCollapsedIds(){
 collapsedIds.delete(data.id);
 safeStorage.setItem(KEY+"_collapsed",JSON.stringify([...collapsedIds]));
}
function descendantsOf(id){
 const out=[];const root=nodeById(id);if(!root)return out;
 function walk(n){(n.children||[]).forEach(c=>{out.push(c.id);walk(c)})}
 walk(root);return out;
}
function buildConnectionParentSet(){
 const incoming=new Set();
 for(const c of connections||[]){
  if(c&&c.from&&c.to&&c.from!==c.to&&nodeById(c.from)&&nodeById(c.to))incoming.add(c.to);
 }
 return incoming;
}
function independentRootIds(){
 const incoming=buildConnectionParentSet();
 return allNodes().filter(n=>n.id!==data.id&&!incoming.has(n.id)).map(n=>n.id);
}
function isNodeHidden(id){
 if(id===data.id)return false;
 const parent=buildParentMap();let cur=parent.get(id)||null;
 while(cur){if(collapsedIds.has(cur))return true;cur=parent.get(cur)||null}
 return false;
}
function expandOneLevel(id){
 const n=nodeById(id),children=n?.children||[];
 if(!n||!children.length)return false;
 pushHistory();
 // 只展開目前這一層；有下一層的子流程本身維持收合，
 // 因此只會出現直接子流程，不會一次把孫分支全部攤開。
 collapsedIds.delete(id);
 children.forEach(c=>{
  if((c.children||[]).length)collapsedIds.add(c.id);
 });
 saveCollapsedIds();render();
 setStatus('已展開「'+n.name+'」的下一階子分支。');
 return true;
}
function toggleSubtree(id){
 if(id===data.id){setStatus("「標題流程」是目前專案根流程，不收合其他獨立父流程；請點實際父流程圖展開／收合。 ");return}
 const n=nodeById(id),children=n?.children||[];
 if(!n||!children.length){setStatus("「"+(n?.name||"流程圖")+"」沒有子孫分支可展開／收合。");return}
 pushHistory();
 const shouldCollapse=!collapsedIds.has(id);
 if(shouldCollapse)collapsedIds.add(id);
 else [id,...descendantsOf(id)].forEach(x=>collapsedIds.delete(x));
 saveCollapsedIds();render();
 setStatus((shouldCollapse?"已收合":"已展開")+"「"+n.name+"」及其所有子孫分支。");
}
function expandAll(){
 if(!collapsedIds.size){setStatus("目前已經全部展開。");return}
 pushHistory();
 collapsedIds.clear();saveCollapsedIds();render();
 setStatus("已全部展開所有獨立父流程及其子孫分支。");
}
function collapseAll(){
 const next=new Set(allNodes().filter(n=>n.id!==data.id&&(n.children||[]).length).map(n=>n.id));
 const same=next.size===collapsedIds.size&&[...next].every(id=>collapsedIds.has(id));
 if(same){setStatus("目前已經全部收合。");return}
 pushHistory();
 collapsedIds=next;
 saveCollapsedIds();render();
 setStatus("已全部收合；保留 "+independentRootIds().length+" 個獨立父流程顯示。");
}
function loadPositions(){
 try{
  const x=JSON.parse(safeStorage.getItem(KEY+"_pos"));
  if(x&&typeof x==="object"&&!Array.isArray(x)){
   const out={};
   for(const [id,p] of Object.entries(x)){
    if(!p||typeof p!=="object")continue;
    const px=Number(p.x),py=Number(p.y);
    if(Number.isFinite(px)&&Number.isFinite(py)){
     out[id]={x:snap10(px),y:snap10(py)};
    }
   }
   if(Object.keys(out).length)return out;
  }
 }catch(e){}
 const out=JSON.parse(JSON.stringify(DEFAULT_POS));
 Object.keys(out).forEach(id=>{
  out[id].x=snap10(out[id].x);
  out[id].y=snap10(out[id].y);
 });
 return out;

 if(!gv||!gh||!axisVisible){hideAlignmentGuides();return{x,y}}

 if(!movingEl){hideAlignmentGuides();return{x,y}}
 const mw=movingEl.offsetWidth,mh=movingEl.offsetHeight;

 let bestV=null,bestH=null;
 for(const n of allNodes()){
  if(n.id===id)continue;

  }
 }

 gv.style.display=bestV&&bestV.d<=guideThreshold?"block":"none";

function buildParentMap(){

 function walk(n,p=null){for(const c of (n.children||[])){parent.set(c.id,n.id);walk(c,n.id)}}

function findTreePath(a,b){
 if(!nodeById(a)||!nodeById(b))return null;
 if(a===b)return[a];

 const up=new Map();let cur=a;
 while(cur){up.set(cur,true);cur=parent.get(cur)||null}

/*
 * 父子關係只在「引線真正改變流程圖端點」時局部更新。
 * 絕不從全部 connections 重建整棵 children 樹。
 */
function hierarchyParentOf(id){
 const r=findNode(id); if(!r)return null;
 return r.parent?.id||null;
}
function hierarchyIsDescendant(ancestorId,id){
 if(!ancestorId||!id)return false;
 const root=nodeById(ancestorId); if(!root)return false;
 const seen=new Set();
 function walk(n){
  if(!n||seen.has(n.id))return false;
  seen.add(n.id);
  if(n.id===id)return true;
  return (n.children||[]).some(walk);
 }
 return walk(root);
}
function detachChildFromParent(childId){
 const r=findNode(childId); if(!r)return false;
 const child=r.node;
 if(r.parent){
  r.parent.children=(r.parent.children||[]).filter(c=>c.id!==childId);
  return true;
 }
 return false;
}
function attachChildToParent(parentId,childId){
 if(!parentId||!childId||parentId===childId)return false;
 const parent=nodeById(parentId),child=nodeById(childId);
 if(!parent||!child)return false;
 // 禁止把祖先掛到自己的子孫底下，避免形成循環。
 if(hierarchyIsDescendant(childId,parentId))return false;
 const oldParent=hierarchyParentOf(childId);
 if(oldParent===parentId)return true;
 detachChildFromParent(childId);
 parent.children=parent.children||[];
 if(!parent.children.some(c=>c.id===childId))parent.children.push(child);
 return true;
}
function makeIndependentFlowchart(childId){
 const r=findNode(childId); if(!r)return false;
 if(!r.parent)return true;
 r.parent.children=(r.parent.children||[]).filter(c=>c.id!==childId);
 if(!data.children.some(c=>c.id===childId))data.children.push(r.node);
 return true;
}
function updateHierarchyForConnectionChange(oldFrom,oldTo,newFrom,newTo){
 // 只有流程圖 ID 改變才會改父子關係；單純換節點圓圈位置不改階層。
 const endpointChanged=oldFrom!==newFrom||oldTo!==newTo;
 if(!endpointChanged)return {changed:false,ok:true};
 let changed=false;
 // 舊的「父→子」關係如果仍是該子目前的直接父層，先解除。
 if(oldTo && hierarchyParentOf(oldTo)===oldFrom){
  makeIndependentFlowchart(oldTo);
  changed=true;
 }
 // 新的「父→子」關係只處理這條引線的終點流程圖。
 if(newFrom && newTo){
  if(newFrom===newTo || hierarchyIsDescendant(newTo,newFrom)){
   // 新關係會造成自己連自己／循環；還原由呼叫端負責。
   return {changed:false,ok:false};
  }
  if(hierarchyParentOf(newTo)!==newFrom){
   attachChildToParent(newFrom,newTo);
   changed=true;
  }
 }
 return {changed,ok:true};
}
function updateHierarchyForNewConnection(from,to){
 if(!from||!to||from===to||hierarchyIsDescendant(to,from))return false;
 return attachChildToParent(from,to);
}
function updateHierarchyForDeletedConnections(deletedConnections){
 let changed=false;
 for(const c of deletedConnections||[]){
  if(c?.from&&c?.to&&hierarchyParentOf(c.to)===c.from){
   makeIndependentFlowchart(c.to);
   changed=true;
  }
 }
 return changed;
}

function collectApplyDescendants(sourceId){
 const root=nodeById(sourceId);
 const ids=new Set();
 function walk(node){
  if(!node||ids.has(node.id))return;
  ids.add(node.id);
  (node.children||[]).forEach(walk);
 }
 walk(root);
 return ids;
}

function cloneApplyTree(source){
 const idMap=new Map([[source.id,source.id]]);
 function cloneNode(node){
  const id=uid();
  idMap.set(node.id,id);
  return {
   id,
   name:node.name,
   type:node.type||"一般",
   note:node.note||"",
   content:node.content||"",
   children:(node.children||[]).map(cloneNode)
  };
 }
 return {children:(source.children||[]).map(cloneNode),idMap};
}

function countTreeNodes(nodes){
 let total=0;
 for(const node of (nodes||[])){
  total++;
  total+=countTreeNodes(node.children||[]);
 }
 return total;
}

// 全新「套用子分支」規則：
// destinationId = 按下套用子分支時已選取的流程圖（接收方）
// templateId    = 按下套用後，使用者左鍵點選的流程圖（來源）
// 例如：先複製出「地監（複製）」→ 選它 → 套用子分支 → 點「地監」
// 結果就是把「地監」下面的第一關／第二關／BOSS關複製到「地監（複製）」下面。
function applyFlowchartToTarget(destinationId,templateId){
 try{
  if(applyFlowchartBusy)return false;
  const destination=nodeById(destinationId);
  const template=nodeById(templateId);
  if(!destination||!template){
   setStatus("找不到套用目標或來源流程圖。");
   return false;
  }
  if(destinationId===templateId){
   setStatus("不能把流程圖套用到自己；請點另一個流程圖。");
   return false;
  }

  // 先把來源子樹完整快照下來，避免複製過程修改 template.children。
  const templateChildren=Array.from(template.children||[]);
  if(!templateChildren.length){
   setStatus("「"+template.name+"」下面沒有子分支可以套用。");
   return false;
  }

  applyFlowchartBusy=true;
  const result=cloneApplyTree(template);
  const copies=result.children;
  const sourceIds=collectApplyDescendants(templateId);
  const templatePos={...ensurePosition(templateId)};
  const destinationPos={...ensurePosition(destinationId)};
  const dx=destinationPos.x-templatePos.x;
  const dy=destinationPos.y-templatePos.y;

  pushHistory();

  // 1. 只把來源的 children 加到接收方；來源流程圖本身不複製。
  destination.children=destination.children||[];
  destination.children.push(...copies);

  // 2. 每一個複製都使用「來源相對於來源根」的座標差，
  //    直接套到「接收方相對於接收方根」的位置。
  function place(original,copied){
   const op=ensurePosition(original.id);
   positions[copied.id]={
    x:snap10(op.x+dx),
    y:snap10(op.y+dy)
   };
   (original.children||[]).forEach((child,i)=>{
    if(copied.children[i])place(child,copied.children[i]);
   });
  }
  templateChildren.forEach((child,i)=>place(child,copies[i]));

  // 3. 複製來源範本內部的所有引線：
  //    - 根 → 子分支：根端點改接到 destination
  //    - 子分支 ↔ 子分支：兩端都映射到新的複製品
  //    - 來源範本外的引線一律不複製
  //    - 引線轉彎點也使用同一個 dx / dy 保留相對位置
  const copiedConnections=[];
  const pairSet=new Set();
  function addCopiedConnection(c){
   if(!c||c.from===c.to)return;
   const from=c.from===templateId?destinationId:result.idMap.get(c.from);
   const to=c.to===templateId?destinationId:result.idMap.get(c.to);
   if(!from||!to||from===to)return;
   const key=from+"|"+to;
   if(pairSet.has(key))return;
   pairSet.add(key);
   const inferred=inferSidesByGeometry(from,to);
   copiedConnections.push({
    id:uid(),
    from,
    to,
    fromSide:c.fromSide||inferred.fromSide,
    toSide:c.toSide||inferred.toSide,
    bends:(c.bends||[]).map(b=>({
     x:snap10(Number(b.x)+dx),
     y:snap10(Number(b.y)+dy)
    }))
   });
  }
  for(const c of connections){
   if(!sourceIds.has(c.from)||!sourceIds.has(c.to))continue;
   addCopiedConnection(c);
  }

  // 舊專案若 children 有父子關係但缺少對應引線，補上結構線。
  function ensureStructural(parentOriginal,childrenOriginal,parentCopied,childrenCopied){
   (childrenOriginal||[]).forEach((child,i)=>{
    const copiedChild=childrenCopied?.[i];
    if(!copiedChild)return;
    const from=parentOriginal.id===templateId?destinationId:result.idMap.get(parentOriginal.id);
    const to=result.idMap.get(child.id);
    if(from&&to&&!connections.some(c=>c.from===parentOriginal.id&&c.to===child.id)
       &&!pairSet.has(from+"|"+to)){
     const sides=inferSidesByGeometry(from,to);
     pairSet.add(from+"|"+to);
     copiedConnections.push({id:uid(),from,to,fromSide:sides.fromSide,toSide:sides.toSide,bends:[]});
    }
    ensureStructural(child,child.children||[],copiedChild,copiedChild.children||[]);
   });
  }
  ensureStructural(template,templateChildren,destination,copies);
  connections.push(...copiedConnections);

  saveData();
  savePositions();
  saveConnections();
  selectedId=destinationId;
  selectedConn=null;
  render();
  setStatus("已將「"+template.name+"」的子分支套用到「"+destination.name+"」：複製 "+countTreeNodes(copies)+" 個流程圖與 "+copiedConnections.length+" 條引線，並保留相對座標。");
  return true;

function selectedDeletableFlowchartRoots(){
 const selected=new Set(selectedIds.filter(id=>id&&id!==data.id&&nodeById(id)));
 if(!selected.size)return [];
 const roots=[];
 for(const id of selected){
  let r=findNode(id),p=r?.parent,blocked=false;
  while(p){
   if(selected.has(p.id)){blocked=true;break}
   p=findNode(p.id)?.parent||null;
  }
  if(!blocked)roots.push(id);
 }
 return roots;
}

   if(deleteIds.has(child.id))return false;

  });
 }
 prune(data);

 deleteIds.forEach(id=>{delete positions[id];collapsedIds.delete(id)});
 groups=groups.map(g=>({...g,ids:g.ids.filter(id=>!deleteIds.has(id))})).filter(g=>g.ids.length>=2);

function collectNodeIds(root){
 const ids=new Set();
 function walk(n){
  if(!n||typeof n!=="object"||typeof n.id!=="string")return;
  ids.add(n.id);
  (Array.isArray(n.children)?n.children:[]).forEach(walk);
 }
 walk(root);
 return ids;
}
function sanitizeImportedPositions(raw,validIds){
 const out={};
 if(raw&&typeof raw==="object"&&!Array.isArray(raw)){
  for(const [id,p] of Object.entries(raw)){
   if(!validIds.has(id)||!p||typeof p!=="object")continue;
   const x=Number(p.x),y=Number(p.y);
   if(Number.isFinite(x)&&Number.isFinite(y))out[id]={x:snap10(x),y:snap10(y)};
  }
 }
 for(const id of validIds){
  if(out[id])continue;
  const d=DEFAULT_POS[id];
  out[id]=d?{x:d.x,y:d.y}:{x:GRID_ORIGIN,y:GRID_ORIGIN};
 }
 return out;
}
function sanitizeImportedConnections(raw,validIds){
 if(!Array.isArray(raw))return [];
 const out=[],seen=new Set();
 for(const c of raw){
  if(!c||typeof c!=="object")continue;
  if(typeof c.from!=="string"||typeof c.to!=="string")continue;
  if(!validIds.has(c.from)||!validIds.has(c.to)||c.from===c.to)continue;
  const key=c.from+"|"+c.to+"|"+(c.fromSide||"")+"|"+(c.toSide||"");
  if(seen.has(key))continue;
  seen.add(key);
  out.push({
   id:typeof c.id==="string"&&c.id?c.id:uid(),
   from:c.from,to:c.to,
   fromSide:typeof c.fromSide==="string"?c.fromSide:"right",
   toSide:typeof c.toSide==="string"?c.toSide:"left",
   bends:Array.isArray(c.bends)?c.bends.map(b=>{
    const x=Number(b?.x),y=Number(b?.y);
    return Number.isFinite(x)&&Number.isFinite(y)?{x:snap10(x),y:snap10(y)}:null;
   }).filter(Boolean):[]
  });
 }
 return out;
}
function normalizeImportedProject(raw){
 if(!raw||typeof raw!=="object")throw new Error("JSON 根資料不是物件。");
 if(!raw.data||typeof raw.data!=="object")throw new Error("JSON 缺少有效的 data 樹狀資料。");
 const ids=collectNodeIds(raw.data);
 if(!ids.size)throw new Error("JSON 沒有有效節點。");
 return {
  data:raw.data,
  positions:sanitizeImportedPositions(raw.positions,ids),
  connections:sanitizeImportedConnections(raw.connections,ids),
  groups:normalizeGroups(raw.groups,ids),
  collapsedIds:new Set(
   Array.isArray(raw.collapsedIds)
    ? raw.collapsedIds.filter(id=>ids.has(id)&&id!==raw.data.id)
    : []
  ),
  theme:raw.theme==="dark"?"dark":"light",
  filename:typeof raw.filename==="string"&&raw.filename?raw.filename:"副本資料整理器.json"
 };
}

// 手機／平板：在畫布上以雙指縮放，並維持兩指中點對應的流程圖位置。
let pinchGesture=null;
let previewPinchActive=false;
let previewSuppressClickUntil=0;
function clearBrowserSelection(){
 try{window.getSelection?.().removeAllRanges()}catch(_){}
}
function preventPreviewSelection(e){
 if(!previewConnections)return;
 e.preventDefault();
 e.stopImmediatePropagation();
 clearBrowserSelection();
}
document.addEventListener("selectstart",preventPreviewSelection,true);
document.addEventListener("selectionstart",preventPreviewSelection,true);
document.addEventListener("dragstart",e=>{
 if(previewConnections){e.preventDefault();e.stopImmediatePropagation();clearBrowserSelection();}
},true);

const pinchCanvas=document.getElementById("canvasScroll");
pinchCanvas.addEventListener("click",e=>{
 if(!previewConnections)return;
 if(previewPinchActive || performance.now()<previewSuppressClickUntil){
   e.preventDefault();e.stopImmediatePropagation();
   clearBrowserSelection();
 }
},{capture:true});
pinchCanvas.addEventListener("pointerdown",e=>{
 if(!previewConnections || e.pointerType!=="touch")return;
 if(e.isPrimary===false){
   previewPinchActive=true;
   previewSuppressClickUntil=performance.now()+500;
   clearBrowserSelection();
   dragging=null;previewPan=null;
   e.preventDefault();e.stopImmediatePropagation();
 }
},{capture:true,passive:false});
function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function touchCenter(a,b){return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
pinchCanvas.addEventListener("touchstart",e=>{
 if(e.touches.length!==2)return;
 previewPinchActive=previewConnections;
 previewSuppressClickUntil=performance.now()+700;
 clearBrowserSelection();
 const [a,b]=e.touches,center=touchCenter(a,b);
 pinchGesture={distance:touchDistance(a,b),zoom,panX,panY,center};
 dragging=null;previewPan=null;
 pinchCanvas.classList.remove("panning");
 e.preventDefault();e.stopImmediatePropagation();
},{capture:true,passive:false});
pinchCanvas.addEventListener("touchmove",e=>{
 if(!pinchGesture||e.touches.length!==2)return;
 if(previewConnections){try{window.getSelection?.().removeAllRanges()}catch(_){}}

 const [a,b]=e.touches,center=touchCenter(a,b),ratio=touchDistance(a,b)/pinchGesture.distance;
 const rect=pinchCanvas.getBoundingClientRect();
 const worldX=(pinchGesture.center.x-rect.left-pinchGesture.panX)/pinchGesture.zoom;
 const worldY=(pinchGesture.center.y-rect.top-pinchGesture.panY)/pinchGesture.zoom;
 zoom=Math.max(.4,Math.min(2.5,pinchGesture.zoom*ratio));
 panX=(center.x-rect.left)-worldX*zoom;
 panY=(center.y-rect.top)-worldY*zoom;
 renderCanvas();
 e.preventDefault();e.stopImmediatePropagation();
},{capture:true,passive:false});
function endPinchGesture(e){
 if(!pinchGesture)return;
 if(e.touches&&e.touches.length>1)return;
 safeStorage.setItem(KEY+"_zoom",String(zoom));
 setStatus("縮放："+Math.round(zoom*100)+"%");
 pinchGesture=null;
 if(previewPinchActive){
   clearBrowserSelection();
   previewSuppressClickUntil=performance.now()+700;
   setTimeout(()=>{previewPinchActive=false;clearBrowserSelection();},750);
 }
 e.preventDefault();
 e.stopImmediatePropagation();
}

// 套用子分支：使用 document 捕獲階段攔截目標流程圖。
// 這樣點標題、類型、方框空白處都會先被辨識，不會被流程圖拖曳或 canvas 事件吃掉。
document.addEventListener("pointerdown",e=>{
 if(!applyFlowchartMode||applyFlowchartBusy||e.button!==0)return;
 if(e.target.closest?.("#applySubbranchBtn"))return;
 if(e.target.closest?.(".handle,.input-handle,.bend-point,.conn"))return;

 // 套用模式的目標是「整個流程圖可視框」，包含選取時藍色外框的區域。
 // outline 本身不屬於 DOM hit area，因此若只靠 closest(.flow-node)，
 // 點到藍色外框時會拿不到目標。這裡再用螢幕座標做一次幾何命中測試，
 // 讓藍框內外的可視範圍都算同一個目標。
 let el=e.target.closest?.(".flow-node");
 if(!el){
  const x=e.clientX,y=e.clientY,halo=8;
  const nodes=document.querySelectorAll(".flow-node");
  for(const candidate of nodes){
   const r=candidate.getBoundingClientRect();
   if(x>=r.left-halo&&x<=r.right+halo&&y>=r.top-halo&&y<=r.bottom+halo){
    el=candidate;
    break;
   }
  }
 }
 if(!el)return;
 const targetId=el.dataset.id;
 const sourceId=applyFlowchartSourceId;
 if(!sourceId){
  setStatus("套用來源遺失，請重新按「套用子分支」。");
  cancelApplyFlowchart();
  return;
 }
 if(sourceId===targetId){
  setStatus("這是來源流程圖；請左鍵點另一個流程圖作為目標。");
  return;
 }
 const ok=applyFlowchartToTarget(sourceId,targetId);
 if(ok)cancelApplyFlowchart();
},true);

// 預覽┅是「看圖」模式：不論按到節點、引線或折點，都交給畫布平移。
// 在 capture 階段攔截，能確實避開節點／引線原本的編輯拖曳監聽器。
let previewPan=null,previewLastTap=null;
const previewCanvas=document.getElementById("canvasScroll");
previewCanvas.addEventListener("pointerdown",e=>{
 if(pinchGesture)return;
 if(!previewConnections||e.button!==0)return;
 const node=e.target.closest?.(".flow-node");
 previewPan={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,panX,panY,nodeId:node?.dataset.id||null,moved:false};
 previewCanvas.classList.add("panning");
 try{previewCanvas.setPointerCapture(e.pointerId)}catch(_){ }
 e.preventDefault();e.stopImmediatePropagation();
},true);
previewCanvas.addEventListener("pointermove",e=>{
 if(!previewPan||e.pointerId!==previewPan.pointerId)return;
 const dx=e.clientX-previewPan.startX,dy=e.clientY-previewPan.startY;
 if(Math.hypot(dx,dy)>6)previewPan.moved=true;
 panX=previewPan.panX+dx;panY=previewPan.panY+dy;renderCanvas();
 e.preventDefault();e.stopImmediatePropagation();
},true);
previewCanvas.addEventListener("pointerup",e=>{
 if(previewPinchActive || performance.now()<previewSuppressClickUntil){
   previewPan=null;
   previewCanvas.classList.remove("panning");
   clearBrowserSelection();
   e.preventDefault();e.stopImmediatePropagation();
   return;
 }
 if(!previewPan||e.pointerId!==previewPan.pointerId)return;
 const finished=previewPan;previewPan=null;
 previewCanvas.classList.remove("panning");
 try{previewCanvas.releasePointerCapture(e.pointerId)}catch(_){ }
 if(!finished.moved&&finished.nodeId){
  const now=performance.now();
  const isDouble=previewLastTap&&previewLastTap.id===finished.nodeId&&(now-previewLastTap.time)<=450;
  if(isDouble){previewLastTap=null;toggleSubtree(finished.nodeId);}
  else previewLastTap={id:finished.nodeId,time:now};
 }
 e.preventDefault();e.stopImmediatePropagation();
},true);
previewCanvas.addEventListener("pointercancel",()=>{previewPan=null;previewCanvas.classList.remove("panning");},true);
previewCanvas.addEventListener("dblclick",e=>{
 if(previewConnections&&e.target.closest?.(".flow-node")){e.preventDefault();e.stopImmediatePropagation();}
},true);

let canvasPanJustFinished=false;
document.getElementById("canvasScroll").addEventListener("pointerdown",e=>{
 if(pinchGesture)return;
 if(e.button!==0)return;
 const target=e.target;
 if(target.closest?.(".flow-node")||target.closest?.(".bend-point")||target.closest?.(".conn"))return;
  // 空白處先只啟動畫布平移；不要在 pointerdown 立即取消選取。
  // 只有最後確認為「沒有拖曳」的空白點擊，才取消全部選取。
 const s=document.getElementById("canvasScroll");
 s.focus({preventScroll:true});
 const sx=e.clientX,sy=e.clientY,px=panX,py=panY;
 let moved=false;
 s.classList.add("panning");
 try{s.setPointerCapture(e.pointerId)}catch(_){}
 const move=ev=>{
   moved=true;
   panX=px+(ev.clientX-sx);
   panY=py+(ev.clientY-sy);
   renderCanvas();
 };
 const up=()=>{
   s.classList.remove("panning");
   try{s.releasePointerCapture(e.pointerId)}catch(_){}
   document.removeEventListener("pointermove",move);
   document.removeEventListener("pointerup",up);
   if(moved){
      canvasPanJustFinished=true;
      setTimeout(()=>{canvasPanJustFinished=false;},0);
    }else{
      selectedIds=[];selectedId=null;selectedConn=null;selectedConnIds.clear();
      allCanvasSelected=false;hideAlignmentGuides();hideNodeGridAnchor();render();
      setStatus("已取消全部選取。");
    }
 };
 document.addEventListener("pointermove",move);
 document.addEventListener("pointerup",up);
 e.preventDefault();
 e.stopPropagation();
});

// 只要操作會離開目前右側設定對象，就先處理尚未儲存的草稿。

// 先改變選取狀態，造成提示出現時畫面已經切換。
function isInsideEditor(target){
 return !!target?.closest?.("#editor");
}
function targetNodeIdFromEvent(target){
 return target?.closest?.(".flow-node")?.dataset?.id||null;
}
function guardLeavingNodeEditor(e){  if(e.type==="click"&&canvasPanJustFinished)return true;  if(!nodeDraftDirty||!unsavedNodeDraft||previewConnections)return true;
 if(isInsideEditor(e.target))return true;
 const targetNodeId=targetNodeIdFromEvent(e.target);
 // 點回目前正在編輯的同一個節點，仍然留在同一個設定介面，不提示。
 if(targetNodeId&&targetNodeId===unsavedNodeDraft.id)return true;

 // 畫布空白區可能只是用來平移畫面；pointerdown 時不能把它誤判成
 // 「離開設定介面」，否則單純拖曳畫布也會跳出未儲存提示。
 // 只有真正可能改變選取／設定對象的物件，才在 pointerdown 階段攔截。
 if(e.type==="pointerdown"){
  const target=e.target?.closest?.(".flow-node,.conn,.bend-point,.handle,.input-handle");
  if(!target)return true;
 }

 // click 事件只會在真正點擊時發生；此時才處理畫布空白、工具列或其他
 // 會讓右側設定介面消失的操作。單純 pointermove/pointerdown 平移不會提示。
 const ok=restoreUnsavedNodeDraft(false);
 if(!ok){
  e.preventDefault();
  e.stopImmediatePropagation();
  return false;
 }
 return true;
}

function handleFileShortcuts(e){
 const active=document.activeElement;
 const tag=(e.target?.tagName||"").toLowerCase();
 const editing=tag==="input"||tag==="textarea"||tag==="select"||active?.isContentEditable;
 const key=e.key;

 // F2：重新命名。文字編輯欄位內保留原生行為。
 if(key==="F2"&&!editing){
  e.preventDefault();
  renameProject();
  return;
 }

 // Ctrl+N / Ctrl+O / Ctrl+S / Ctrl+Shift+S
 // 在文字編輯欄位內不攔截，避免破壞使用者輸入。
 if(editing||!e.ctrlKey||e.altKey)return;

 if(key==="n"||key==="N"){
  e.preventDefault();
  newProject();
  return;
 }
 if(key==="o"||key==="O"){
  e.preventDefault();
  openProject();
  return;
 }
 // Ctrl+Shift+S 必須先於 Ctrl+S。
 if((key==="s"||key==="S")&&e.shiftKey){
  e.preventDefault();
  saveProject(true);
  return;
 }
 if(key==="s"||key==="S"){
  e.preventDefault();
  saveProject(false);
 }
}

<script id="collapse-button-align-script">
(function () {
  function alignRailToggleToToolbarToggle() {
    const rail = document.querySelector('.function-rail.rail-collapsed');
    const railBtn = document.getElementById('functionRailToggleBtn');
    const toolbarBtn = document.getElementById('toolbarToggleBtn');
    if (!rail || !railBtn || !toolbarBtn) return;

    const toolbar = toolbarBtn.getBoundingClientRect();
    const gap = 6;
    railBtn.style.top = toolbar.top + 'px';
    railBtn.style.left = Math.max(4, toolbar.left - railBtn.offsetWidth - gap) + 'px';
  }

  function scheduleAlign() {
    requestAnimationFrame(alignRailToggleToToolbarToggle);
  }

  window.addEventListener('resize', scheduleAlign, { passive: true });

  const observer = new MutationObserver(scheduleAlign);
  observer.observe(document.documentElement, {
    subtree: true,
    attributes: true,
    attributeFilter: ['class', 'style']
  });

  scheduleAlign();
})();

/* v1.1.73：移除會攔截點擊的命中覆蓋路徑，改由 SVG 捕獲階段判定最近引線。 */
(function installConnectionProximitySelection(){
 const svg=document.getElementById("diagramSvg");
 if(!svg)return;
 svg.addEventListener("click",function(e){
  if(!connectionSelectMode||previewConnections)return;
  const ctm=svg.getScreenCTM?.();
  if(!ctm)return;
  let best=null,bestScreenDistance=Infinity;
  const tolerance=72;
  for(const c of connections||[]){
   if(isNodeHidden(c.from)||isNodeHidden(c.to))continue;
   const d=connectionPath(c);
   if(!d)continue;
   const probe=document.createElementNS("http://www.w3.org/2000/svg","path");
   probe.setAttribute("d",d);
   const total=probe.getTotalLength?.()||0;
   if(!total)continue;
   const steps=Math.min(320,Math.max(32,Math.ceil(total/12)));
   for(let i=0;i<=steps;i++){
    const q=probe.getPointAtLength(total*i/steps);
    const screen=new DOMPoint(q.x,q.y).matrixTransform(ctm);
    const distance=Math.hypot(screen.x-e.clientX,screen.y-e.clientY);
    if(distance<bestScreenDistance){bestScreenDistance=distance;best=c;}
   }
  }
  if(best&&bestScreenDistance<=tolerance){
   e.preventDefault();e.stopImmediatePropagation();
   selectedConnIds.clear();selectedConn=best.id;
   setStatus("已選取引線："+(nodeById(best.from)?.name||best.from)+" → "+(nodeById(best.to)?.name||best.to));
   drawConnections();
  }
 },true);
})();
</script>
